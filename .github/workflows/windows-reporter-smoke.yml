name: Windows Reporter smoke test

on:
  push:
  pull_request:

jobs:
  windows-reporter:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install packaging pytest PyYAML
      - name: Run test suite
        run: >-
          python -m pytest -q
          tests/test_plugin_structure.py
          tests/test_skill_contract.py
          tests/test_wheelhouse.py
          plugins/shopops-onboarding/tests/test_environment.py
          plugins/shopops-onboarding/tests/test_activation.py
      - name: Verify upgrade and new capability snapshots
        run: python scripts/reporter_upgrade_acceptance.py
      - name: Verify old daemon activates the installed current runtime
        run: python scripts/reporter_activation_acceptance.py
      - name: Install locked Reporter payload
        shell: pwsh
        run: |
          $pluginRoot = Join-Path $PWD "plugins\shopops-onboarding"
          $env:PYTHONPATH = Join-Path $pluginRoot "tools"
          Push-Location $pluginRoot
          $install = @'
          from dataclasses import asdict
          import json, sys
          from pathlib import Path
          from shopops_plugin_helper.environment import probe_environment
          from shopops_plugin_helper.installer import default_reporter_home, install_preview, install_reporter
          probe = probe_environment([sys.executable])
          preview = install_preview(Path.cwd(), default_reporter_home(), probe)
          result = install_reporter(Path.cwd(), default_reporter_home(), probe)
          assert result.version == preview.version
          print(json.dumps({'install': asdict(result)}))
          '@
          $preview = python -c $install | ConvertFrom-Json
          if (-not $preview.install.version) { throw "Missing Reporter preview version" }
          $shim = Join-Path $env:LOCALAPPDATA "ShopOps\Reporter\bin\shopops-report.cmd"
          & $shim --json status
          if ($LASTEXITCODE -ne 2) { throw "Expected unpaired Reporter status" }

          $parserCheck = @'
          from shopops_reporter.cli import split_command
          assert split_command('"C:\\Program Files\\Python311\\python.exe" task.py') == [r'C:\Program Files\Python311\python.exe', 'task.py']
          '@
          $runtimePython = Join-Path $preview.install.runtime_dir "venv\Scripts\python.exe"
          & $runtimePython -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}'; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "Runtime Python does not match matrix" }
          & $runtimePython -c $parserCheck

          $reporterHome = Join-Path $env:LOCALAPPDATA "ShopOps\Reporter"
          @{
            server_url = "http://127.0.0.1:9"
            device_id = "windows-smoke-device"
            installation_id = "windows-smoke-installation"
            display_name = "Windows smoke test"
            declared_operator = $null
            private_key_storage = "file"
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $reporterHome "device.json")
          $privateKey = & $runtimePython -c "from shopops_reporter.client import generate_private_key; print(generate_private_key()[0])"
          Set-Content -Encoding ascii (Join-Path $reporterHome "device.key") $privateKey
          & $shim start
          if ($LASTEXITCODE -ne 0) { throw "Reporter daemon did not start" }
          Start-Sleep -Milliseconds 500
          $pidPath = Join-Path $reporterHome "reporter.pid"
          if (Test-Path $pidPath) {
            $processRecord = Get-Content -Raw $pidPath | ConvertFrom-Json
            $daemonPid = [int]$processRecord.pid
            Get-Process -Id $daemonPid -ErrorAction SilentlyContinue | Format-List Id, ProcessName, HasExited
            $nativeProbe = "from shopops_reporter.daemon import process_running; print(process_running($daemonPid))"
            & $runtimePython -c $nativeProbe
          } else {
            Write-Output "Reporter PID file is missing"
          }
          $status = & $shim --json status | ConvertFrom-Json
          $status | ConvertTo-Json -Depth 5
          if (-not $status.data.daemon.running) {
            Get-Content (Join-Path $reporterHome "reporter.log") -ErrorAction SilentlyContinue
            throw "Reporter daemon is not running"
          }
          & $runtimePython (Join-Path $env:GITHUB_WORKSPACE "scripts\schedule_scope_acceptance.py")
          if ($LASTEXITCODE -ne 0) { throw "Schedule scope acceptance failed" }
          & $runtimePython (Join-Path $env:GITHUB_WORKSPACE "scripts\native_reporter_acceptance.py")
          if ($LASTEXITCODE -ne 0) { throw "Guided onboarding acceptance failed" }
          & $runtimePython (Join-Path $env:GITHUB_WORKSPACE "scripts\contract_v2_acceptance.py")
          if ($LASTEXITCODE -ne 0) { throw "Contract v2 migration and code reuse acceptance failed" }
          & $shim stop
          if ($LASTEXITCODE -ne 0) { throw "Reporter daemon did not stop" }
          Pop-Location
